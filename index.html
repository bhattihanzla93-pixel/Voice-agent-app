<!--
  Sada (سدا) — a bilingual (Urdu/English) voice Q&A agent.
  Mic -> Web Speech API (browser STT) -> our own /api/ask backend (which
  holds the Anthropic API key and calls Claude) -> spoken back with the
  browser's own TTS. See server.js for the backend half of this.

  known limits:
    - Web Speech API needs Chrome/Edge (desktop or Android). Safari/iOS
      support is patchy to absent — we detect and show a clear message.
    - recognition language is picked by the toggle, not auto-detected —
      true language-ID would need a server-side STT model we don't have here.
    - needs to be served over https (or localhost) — mic access is blocked
      on plain http/file:// pages by the browser itself.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>Sada — Voice Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%234cd9e8'/%3E%3C/svg%3E">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap"></noscript>
<style>
  :root{
    --bg:#0a0d17;
    --panel:#141a2c;
    --panel2:#1b2338;
    --ink:#f3f5fc;
    --muted:#8892ac;
    --line:rgba(255,255,255,0.08);
    --en:#4cd9e8;
    --en-dim:rgba(76,217,232,0.15);
    --ur:#ffb454;
    --ur-dim:rgba(255,180,84,0.15);
    --accent:var(--en);
    --accent-dim:var(--en-dim);
    --danger:#ff6b6b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:'Inter',sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 10% -5%, rgba(76,217,232,0.10), transparent 40%),
      radial-gradient(circle at 90% 105%, rgba(255,180,84,0.08), transparent 40%),
      var(--bg);
  }
  .app{ display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:480px; margin:0 auto; }

  /* ---------------- App bar ---------------- */
  .appbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 18px; border-bottom:1px solid var(--line);
    background:rgba(10,13,23,0.85); backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(135deg, var(--en), #2b7d8c);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(76,217,232,0.25);
  }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-text .name{ font-family:'Sora',sans-serif; font-weight:700; font-size:16.5px; line-height:1.15; letter-spacing:-0.2px; }
  .brand-text .sub{ font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; margin-top:2px; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:#3ddc84; box-shadow:0 0 6px #3ddc84; flex-shrink:0; }

  .lang-toggle{ display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:4px; flex-shrink:0; }
  .lang-btn{
    padding:7px 13px; border-radius:8px; border:none; background:transparent;
    color:var(--muted); font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    cursor:pointer; transition:0.2s; white-space:nowrap;
  }
  .lang-btn.active.en{ background:var(--en-dim); color:var(--en); }
  .lang-btn.active.ur{ background:var(--ur-dim); color:var(--ur); }

  /* ---------------- Chat area ---------------- */
  .chat{ flex:1; overflow-y:auto; padding:20px 16px 10px; display:flex; flex-direction:column; gap:14px; -webkit-overflow-scrolling:touch; }

  .empty-state{ margin:auto 0; text-align:center; padding:20px; color:var(--muted); }
  .empty-state .ring{
    width:64px; height:64px; border-radius:50%; margin:0 auto 16px;
    border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center;
  }
  .empty-state .ring svg{ width:26px; height:26px; stroke:var(--muted); }
  .empty-state p{ font-size:13.5px; line-height:1.6; max-width:260px; margin:0 auto; }

  .row{ display:flex; gap:9px; align-items:flex-end; animation:rise 0.28s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
  .row.user{ justify-content:flex-end; }
  .row.assistant{ justify-content:flex-start; }

  .avatar{
    width:28px; height:28px; border-radius:9px; flex-shrink:0;
    background:linear-gradient(135deg, var(--en), #2b7d8c);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar svg{ width:14px; height:14px; }

  .msg{ max-width:78%; padding:11px 14px; border-radius:15px; font-size:14.5px; line-height:1.6; }
  .row.user .msg{ background:var(--en); color:#04222a; border-bottom-right-radius:5px; font-weight:500; }
  .row.assistant .msg{ background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .msg.ur-text{ font-family:'Noto Nastaliq Urdu',serif; font-size:18px; line-height:2; direction:rtl; text-align:right; }
  .row.error .msg{ background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3); color:#ffb3b3; }

  .thinking-msg{ display:flex; gap:5px; align-items:center; padding:4px 2px; }
  .thinking-msg .dot{ width:6px; height:6px; border-radius:50%; background:var(--muted); animation:bounce 1.2s infinite ease-in-out; }
  .thinking-msg .dot:nth-child(2){ animation-delay:0.15s; }
  .thinking-msg .dot:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:0.5;} 30%{ transform:translateY(-4px); opacity:1;} }

  /* ---------------- Control bar ---------------- */
  .control-bar{
    padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:rgba(10,13,23,0.9); backdrop-filter:blur(10px);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .status-pill{
    font-size:12px; color:var(--muted); padding:5px 14px; border-radius:20px;
    background:var(--panel); border:1px solid var(--line); min-height:14px; text-align:center;
  }

  .mic-row{ display:flex; align-items:center; justify-content:center; gap:20px; width:100%; }
  .mic-btn{
    width:64px; height:64px; border-radius:50%; border:none; cursor:pointer; position:relative;
    background:linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 60%, black 30%));
    box-shadow:0 0 0 5px var(--accent-dim), 0 8px 24px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.15s ease, box-shadow 0.3s ease;
  }
  .mic-btn:active{ transform:scale(0.94); }
  .mic-btn svg{ width:24px; height:24px; z-index:2; }
  .mic-btn.listening{ box-shadow:0 0 0 5px var(--accent-dim), 0 0 0 12px transparent, 0 8px 24px rgba(0,0,0,0.35); animation:ripple 1.4s infinite; }
  .mic-btn.thinking{ animation:spin-pulse 1s linear infinite; }
  @keyframes ripple{ 0%{ box-shadow:0 0 0 5px var(--accent-dim), 0 0 0 5px var(--accent-dim), 0 8px 24px rgba(0,0,0,0.35);} 100%{ box-shadow:0 0 0 5px var(--accent-dim), 0 0 0 22px transparent, 0 8px 24px rgba(0,0,0,0.35);} }
  @keyframes spin-pulse{ 0%,100%{ opacity:0.75;} 50%{ opacity:1;} }

  .wave{ display:flex; align-items:center; gap:3px; height:22px; }
  .wave span{ width:3px; border-radius:2px; background:var(--accent); height:6px; opacity:0.5; }
  .mic-btn.listening ~ .wave span, .row.listening-active .wave span{ animation:wavebar 0.9s infinite ease-in-out; }
  @keyframes wavebar{ 0%,100%{ height:6px; opacity:0.5;} 50%{ height:20px; opacity:1;} }
  .wave.idle span{ animation:none !important; height:4px; opacity:0.25; }
  .wave span:nth-child(1){ animation-delay:0s; } .wave span:nth-child(2){ animation-delay:0.1s; }
  .wave span:nth-child(3){ animation-delay:0.2s; } .wave span:nth-child(4){ animation-delay:0.3s; }
  .wave span:nth-child(5){ animation-delay:0.4s; }
</style>
</head>
<body>

<div class="app">

  <header class="appbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04222a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="name">Sada</div>
        <div class="sub"><span class="live-dot"></span> AI Voice Assistant</div>
      </div>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active en" id="btnEn" onclick="setLang('en')">EN</button>
      <button class="lang-btn ur" id="btnUr" onclick="setLang('ur')">اردو</button>
    </div>
  </header>

  <main class="chat" id="thread">
    <div class="empty-state" id="emptyNote">
      <div class="ring">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        </svg>
      </div>
      <p>Tap the mic below and ask anything — in Urdu or English. Sada will answer back out loud.</p>
    </div>
  </main>

  <div class="control-bar">
    <div class="status-pill" id="statusText">Tap to ask</div>
    <div class="mic-row">
      <div class="wave idle" id="waveLeft"><span></span><span></span><span></span></div>
      <button class="mic-btn" id="orbBtn" onclick="onOrbTap()" aria-label="Tap to ask a question">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div class="wave idle" id="waveRight"><span></span><span></span><span></span></div>
    </div>
  </div>

</div>

<script>
const API_URL = '/api/ask';

let currentLang = 'en'; // 'en' | 'ur'
let history = []; // {role, content}
let recognition = null;
let isListening = false;
let isThinking = false;
let ttsVoices = { en: null, ur: null };

function pickVoices(){
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  const clean = voices.filter(v => !/child|kid/i.test(v.name));
  ttsVoices.en = clean.find(v => /^en/i.test(v.lang) && /male/i.test(v.name)) || clean.find(v => /^en/i.test(v.lang)) || null;
  ttsVoices.ur = clean.find(v => /^ur/i.test(v.lang)) || clean.find(v => /^hi/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){
  pickVoices();
  speechSynthesis.onvoiceschanged = pickVoices;
}

function setLang(lang){
  currentLang = lang;
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.getElementById('btnUr').classList.toggle('active', lang === 'ur');
  document.documentElement.style.setProperty('--accent', lang === 'ur' ? 'var(--ur)' : 'var(--en)');
  document.documentElement.style.setProperty('--accent-dim', lang === 'ur' ? 'var(--ur-dim)' : 'var(--en-dim)');
  setStatus(lang === 'ur' ? 'بولنے کے لیے دبائیں' : 'Tap to ask');
}

function setStatus(text){
  document.getElementById('statusText').innerHTML = text;
}

function setWaves(active){
  ['waveLeft','waveRight'].forEach(id => document.getElementById(id).classList.toggle('idle', !active));
}

function setOrbState(state){
  const orb = document.getElementById('orbBtn');
  orb.classList.remove('listening', 'thinking');
  if(state) orb.classList.add(state);
  setWaves(state === 'listening');
}

function initRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    setStatus("This browser can't listen — try Chrome or Edge.");
    document.getElementById('orbBtn').disabled = true;
    return null;
  }
  const rec = new SR();
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  return rec;
}

function onOrbTap(){
  if(isThinking) return;
  if(isListening){
    recognition && recognition.stop();
    return;
  }
  startListening();
}

function startListening(){
  if(!recognition) recognition = initRecognition();
  if(!recognition) return;

  recognition.lang = currentLang === 'ur' ? 'ur-PK' : 'en-US';

  recognition.onstart = () => {
    isListening = true;
    setOrbState('listening');
    setStatus(currentLang === 'ur' ? 'سن رہا ہوں…' : 'Listening…');
  };
  recognition.onerror = (e) => {
    isListening = false;
    setOrbState(null);
    if(e.error === 'not-allowed' || e.error === 'permission-denied'){
      setStatus(currentLang === 'ur' ? 'مائیک کی اجازت درکار ہے' : 'Mic permission needed — check your browser settings');
    } else if(e.error === 'no-speech'){
      setStatus(currentLang === 'ur' ? 'کچھ سنائی نہیں دیا، دوبارہ کوشش کریں' : "Didn't catch that — try again");
    } else {
      setStatus(currentLang === 'ur' ? 'کچھ غلط ہو گیا' : 'Something went wrong — try again');
    }
  };
  recognition.onend = () => {
    isListening = false;
    if(!isThinking) setOrbState(null);
  };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    if(transcript && transcript.trim()) handleQuestion(transcript.trim());
  };

  try{ recognition.start(); } catch(e){ /* already running, ignore */ }
}

async function handleQuestion(text){
  hideEmptyState();
  addBubble('user', text);
  isThinking = true;
  setOrbState('thinking');
  setStatus(currentLang === 'ur' ? 'سوچ رہا ہوں…' : 'Thinking…');
  const thinkingRow = addThinkingBubble();

  history.push({ role: 'user', content: text });

  try{
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history: history })
    });
    const data = await response.json();
    if(!response.ok){
      throw new Error(data.error || 'Server error');
    }
    const answerText = data.answer && data.answer.trim()
      ? data.answer.trim()
      : (currentLang === 'ur' ? 'معذرت، جواب نہیں مل سکا۔' : "Sorry, I couldn't get an answer just now.");

    history.push({ role: 'assistant', content: answerText });
    thinkingRow.remove();
    addBubble('assistant', answerText);
    speak(answerText);
  } catch(e){
    thinkingRow.remove();
    addBubble('error', currentLang === 'ur' ? 'جواب نہیں مل سکا — انٹرنیٹ چیک کریں۔' : 'Could not get an answer — check your connection and try again.');
  } finally{
    isThinking = false;
    setOrbState(null);
    setStatus(currentLang === 'ur' ? 'بولنے کے لیے دبائیں' : 'Tap to ask');
  }
}

function hideEmptyState(){
  const el = document.getElementById('emptyNote');
  if(el) el.style.display = 'none';
}

function addThinkingBubble(){
  const thread = document.getElementById('thread');
  const row = document.createElement('div');
  row.className = 'row assistant';
  row.innerHTML = `
    <div class="avatar">${assistantIconSvg()}</div>
    <div class="msg thinking-msg"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  `;
  thread.appendChild(row);
  row.scrollIntoView({ behavior:'smooth', block:'end' });
  return row;
}

function assistantIconSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#04222a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>';
}

function addBubble(role, text, langOverride){
  const thread = document.getElementById('thread');
  const isUr = (langOverride || currentLang) === 'ur';
  const row = document.createElement('div');

  if(role === 'user'){
    row.className = 'row user';
    row.innerHTML = `<div class="msg${isUr ? ' ur-text' : ''}">${escapeHtml(text)}</div>`;
  } else if(role === 'assistant'){
    row.className = 'row assistant';
    row.innerHTML = `<div class="avatar">${assistantIconSvg()}</div><div class="msg${isUr ? ' ur-text' : ''}">${escapeHtml(text)}</div>`;
  } else {
    row.className = 'row assistant error';
    row.innerHTML = `<div class="avatar">${assistantIconSvg()}</div><div class="msg">${escapeHtml(text)}</div>`;
  }
  thread.appendChild(row);
  row.scrollIntoView({ behavior:'smooth', block:'end' });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function speak(text, langOverride){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const isUr = (langOverride || currentLang) === 'ur';
  utter.lang = isUr ? 'ur-PK' : 'en-US';
  const voice = isUr ? ttsVoices.ur : ttsVoices.en;
  if(voice) utter.voice = voice;
  utter.rate = 0.95;
  speechSynthesis.speak(utter);
}

// Greets the person as soon as Sada opens. Browsers sometimes block audio
// that isn't triggered by a tap, so the greeting always shows as text too —
// the voice is a bonus when the browser allows it, not a requirement.
function greetUser(){
  hideEmptyState();
  const greeting = 'السلام علیکم، آپ کیا پوچھنا چاہتے ہیں؟';
  addBubble('assistant', greeting, 'ur');
  speak(greeting, 'ur');
}

recognition = initRecognition();
window.addEventListener('load', () => { setTimeout(greetUser, 400); });
</script>

</body>
</html>
